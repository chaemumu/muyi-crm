name: CRM health check

# 30분마다 CRM(사이트·DB·Auth) + 홈페이지(사이트·DB·문의 접수 함수) 상태 점검
# - 실패 시 카카오워크 알림 (시크릿 KAKAOWORK_WEBHOOK_URL 우선 → 홈페이지 notify-alert → CRM kakaowork-notify) + GitHub 실패 메일
# - DB 조회가 주기적으로 발생하므로 Supabase Free 플랜 자동 일시정지도 방지
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        id: checks
        run: |
          SB_URL=$(grep -oP 'const SB_URL="\K[^"]+' js/supabase.js)
          SB_KEY=$(grep -oP 'const SB_KEY="\K[^"]+' js/supabase.js)
          FAILS=""

          check() { # name, expected code regex, url, [curl args...]
            local name="$1" expect="$2" url="$3"; shift 3
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@" "$url" || true)
            [ -z "$code" ] && code=000
            echo "$name → HTTP $code"
            if ! [[ "$code" =~ ^($expect)$ ]]; then
              FAILS="${FAILS}• ${name} (HTTP ${code})\n"
            fi
          }

          check "CRM 사이트"      "200" "https://muyi-crm.vercel.app/"
          check "Supabase DB"     "200" "$SB_URL/rest/v1/call_logs?select=id&limit=1" \
                -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"
          check "Supabase 로그인" "200" "$SB_URL/auth/v1/health" -H "apikey: $SB_KEY"

          # 홈페이지 + 문의 접수 경로 (홈페이지 Supabase)
          HP_URL=$(grep -oP 'const ALERT_HP_URL="\K[^"]+' js/supabase.js | sed 's#/functions/v1/.*##')
          HP_KEY=$(grep -oP 'const ALERT_HP_KEY="\K[^"]+' js/supabase.js)
          check "홈페이지"            "200" "https://www.muyi.co.kr/" -L
          check "홈페이지 DB"         "200" "$HP_URL/rest/v1/contacts?select=id&limit=1" \
                -H "apikey: $HP_KEY" -H "Authorization: Bearer $HP_KEY"
          # 필수값 없는 요청 → 함수가 살아 있으면 400(검증 오류), 죽었으면 5xx/000. 문의는 생성되지 않음
          check "문의 접수 함수"      "400" "$HP_URL/functions/v1/contact" -X POST \
                -H "apikey: $HP_KEY" -H 'Content-Type: application/json' -d '{}'

          {
            echo "fails<<EOF"
            printf "%b" "$FAILS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -z "$FAILS" ]

      - name: Notify KakaoWork
        if: failure()
        env:
          WEBHOOK: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          FAILS: ${{ steps.checks.outputs.fails }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          TEXT=$(printf '🚨 *MUYI CRM 장애 감지*\n\n%s\n\n🕐 %s\n🔗 %s' "$FAILS" "$NOW" "$RUN_URL")
          if [ -n "$WEBHOOK" ]; then
            # 시크릿 웹훅 직접 발송 (Supabase 전체 장애 시에도 동작)
            jq -n --arg t "$TEXT" '{text:$t}' | curl -s -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
            exit 0
          fi
          # 1차: 홈페이지 Supabase notify-alert (관리자 카카오워크 방), 2차: CRM kakaowork-notify
          HP_URL=$(grep -oP 'const ALERT_HP_URL="\K[^"]+' js/supabase.js)
          HP_KEY=$(grep -oP 'const ALERT_HP_KEY="\K[^"]+' js/supabase.js)
          code=$(jq -n --arg d "$(printf '%b' "$FAILS")" --arg u "$RUN_URL" \
              '{system:"상태 점검",title:"서비스 응답 이상",detail:$d,page:$u}' \
            | curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
              -H 'Content-Type: application/json' -H "apikey: $HP_KEY" -d @- "$HP_URL" || true)
          echo "notify-alert → HTTP $code"
          [ "$code" = "200" ] && exit 0
          SB_URL=$(grep -oP 'const SB_URL="\K[^"]+' js/supabase.js)
          SB_KEY=$(grep -oP 'const SB_KEY="\K[^"]+' js/supabase.js)
          jq -n --arg t "$TEXT" '{type:"alert",data:{message:$t}}' | curl -s --max-time 20 -X POST \
            -H 'Content-Type: application/json' -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -d @- "$SB_URL/functions/v1/kakaowork-notify" || echo "카카오워크 발송 실패 — GitHub 메일 알림만 발송"
